name: Weekly data update

# Every Monday: fetch the current CSV files from writteninbitcoin.com/datasets, keep a dated snapshot, commit when the data
# changed. The quantum report is rebuilt weekly on the site, the block-space table daily.
on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the current CSV files
        run: bash scripts/update.sh
      - name: Commit when the data changed
        run: |
          if [ -z "$(git status --porcelain data snapshots)" ]; then echo "no change"; exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data snapshots
          git commit -m "data: $(jq -r '[.files[] | "\(.name) as of \(.as_of_date)"] | join(", ")' data/manifest.json)"
          git push
